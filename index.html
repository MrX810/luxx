<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Kartenspiel‑Bibliothek</title>
    <link href="https://fonts.googleapis.com/css?family=Happy%20Monkey:700|Happy%20Monkey:400" rel="stylesheet" />
    <style>
        /* ----- Grundlagen ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 100%;
            /* 16px */
        }

        body {
            font-family: 'Happy Monkey', cursive;
            font-weight: 400;
            background: #f5f0e8;
            color: #2c1f14;
            padding: 0.8rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        h1,
        h2,
        h3,
        h4,
        h5 {
            font-family: 'Happy Monkey', cursive;
            font-weight: 700;
        }

        h1 {
            font-size: 3.366rem;
        }
        h2 {
            font-size: 2.525rem;
        }
        h3 {
            font-size: 1.894rem;
        }
        h4 {
            font-size: 1.421rem;
        }
        h5 {
            font-size: 1.066rem;
        }
        small {
            font-size: 0.600rem;
        }

        /* ----- App Container ----- */
        #app {
            max-width: 1000px;
            width: 100%;
            background: #fffcf8;
            border-radius: 2.5rem;
            box-shadow: 0 8px 30px rgba(44, 31, 20, 0.10);
            padding: 1.5rem 1.2rem 2rem;
            border: 2px solid #e6dacb;
        }

        /* ----- Header ----- */
        header {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.8rem;
            border-bottom: 3px dashed #dccfc0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.8rem;
            font-weight: 700;
            color: #2c1f14;
            letter-spacing: -0.5px;
        }
        .logo small {
            font-size: 0.75rem;
            font-weight: 400;
            color: #7b6856;
        }

        .header-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            align-items: center;
        }

        /* ----- Buttons (rund, verspielt) ----- */
        button {
            font-family: 'Happy Monkey', cursive;
            background: #e6dacb;
            border: 2px solid #cbb8a5;
            padding: 0.6rem 1.4rem;
            border-radius: 3rem;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s, transform 0.05s;
            color: #2c1f14;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            touch-action: manipulation;
            min-height: 48px;
            justify-content: center;
            box-shadow: 0 2px 0 #b8a28b;
        }
        button:active {
            transform: scale(0.95);
            box-shadow: 0 1px 0 #b8a28b;
        }
        button.primary {
            background: #2c1f14;
            border-color: #2c1f14;
            color: #f5f0e8;
            box-shadow: 0 2px 0 #1f140c;
        }
        button.primary:active {
            box-shadow: 0 1px 0 #1f140c;
        }
        button.success {
            background: #3b7a5a;
            border-color: #2f6247;
            color: white;
            box-shadow: 0 2px 0 #2f6247;
        }
        button.success:active {
            box-shadow: 0 1px 0 #2f6247;
        }
        button.danger {
            background: #b85a4a;
            border-color: #9e4536;
            color: white;
            box-shadow: 0 2px 0 #9e4536;
        }
        button.danger:active {
            box-shadow: 0 1px 0 #9e4536;
        }
        button.outline {
            background: transparent;
            border: 2px solid #cbb8a5;
            box-shadow: none;
        }
        button.outline:active {
            box-shadow: none;
            background: #f0e8dd;
        }

        /* ----- Spielinfo ----- */
        .spiel-info {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem 1.2rem;
            background: #f5efe8;
            border-radius: 2rem;
            padding: 0.7rem 1.2rem;
            margin-bottom: 1.2rem;
            border: 2px solid #e6dacb;
            align-items: baseline;
            font-size: 0.95rem;
        }
        .spiel-info .label {
            color: #7b6856;
            font-weight: 700;
            margin-right: 0.2rem;
        }
        .spiel-info .value {
            font-weight: 700;
        }

        /* ----- Tabelle (ohne Gesamt-Spalte) ----- */
        .table-wrap {
            overflow-x: auto;
            border-radius: 1.8rem;
            border: 2px solid #e6dacb;
            background: #ffffff;
            margin-bottom: 1.2rem;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            min-width: 350px;
        }

        th {
            background: #f5efe8;
            color: #2c1f14;
            font-weight: 700;
            padding: 0.6rem 0.5rem;
            text-align: left;
            border-bottom: 3px solid #dccfc0;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        th:first-child {
            padding-left: 1rem;
        }
        th:last-child {
            padding-right: 1rem;
        }

        td {
            padding: 0.6rem 0.5rem;
            border-bottom: 1px solid #ede5da;
            vertical-align: middle;
            text-align: center;
        }
        td:first-child {
            padding-left: 1rem;
            font-weight: 700;
            text-align: left;
        }
        td:last-child {
            padding-right: 1rem;
        }

        .runden-nr {
            color: #2c1f14;
        }
        .datum-cell {
            color: #7b6856;
            font-size: 0.7rem;
            white-space: nowrap;
        }

        /* ----- Spieler-Buttons (unter der Tabelle) ----- */
        .spieler-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin: 1rem 0 0.5rem;
            justify-content: center;
        }
        .spieler-actions button {
            flex: 0 1 auto;
            min-width: 80px;
            background: #f5efe8;
            border-color: #dccfc0;
            font-size: 0.95rem;
            padding: 0.5rem 1.2rem;
            box-shadow: 0 2px 0 #cbb8a5;
        }
        .spieler-actions button:active {
            box-shadow: 0 1px 0 #cbb8a5;
        }
        .spieler-actions button .punkte-badge {
            display: inline-block;
            background: #2c1f14;
            color: #f5f0e8;
            border-radius: 2rem;
            padding: 0 0.6rem;
            font-size: 0.8rem;
            margin-left: 0.4rem;
            line-height: 1.6;
        }

        /* ----- Popup (Overlay) ----- */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(44, 31, 20, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: scale(0.95);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .popup-box {
            background: #fffcf8;
            border-radius: 2.5rem;
            padding: 1.8rem 2rem 2rem;
            max-width: 400px;
            width: 90%;
            border: 3px solid #dccfc0;
            box-shadow: 0 12px 40px rgba(44, 31, 20, 0.2);
        }
        .popup-box h3 {
            text-align: center;
            margin-bottom: 0.6rem;
            color: #2c1f14;
        }
        .popup-box .sub {
            text-align: center;
            color: #7b6856;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .popup-input-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
        }

        .popup-input-area input {
            font-family: 'Happy Monkey', cursive;
            font-size: 2.2rem;
            font-weight: 700;
            text-align: center;
            width: 100%;
            padding: 0.4rem 0;
            border: 3px solid #dccfc0;
            border-radius: 2rem;
            background: #f5efe8;
            color: #2c1f14;
            outline: none;
            min-height: 70px;
            /* Mobil: numerische Tastatur */;
            inputmode: numeric;
            type: number;
            pattern: "[-+]?[0-9]*";
        }
        .popup-input-area input:focus {
            border-color: #2c1f14;
            background: #fffcf8;
        }

        .popup-tasten {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.6rem;
            width: 100%;
            margin-top: 0.4rem;
        }
        .popup-tasten button {
            font-family: 'Happy Monkey', cursive;
            font-size: 1.8rem;
            font-weight: 700;
            padding: 0.6rem 0;
            border-radius: 2rem;
            background: #e6dacb;
            border: 2px solid #cbb8a5;
            color: #2c1f14;
            min-height: 60px;
            box-shadow: 0 2px 0 #b8a28b;
            transition: 0.05s;
            cursor: pointer;
            touch-action: manipulation;
        }
        .popup-tasten button:active {
            transform: scale(0.94);
            box-shadow: 0 1px 0 #b8a28b;
        }
        .popup-tasten .op {
            background: #dccfc0;
            border-color: #b8a28b;
        }
        .popup-tasten .clear {
            background: #f0d5c8;
            border-color: #d8b8a5;
        }
        .popup-tasten .enter {
            background: #3b7a5a;
            border-color: #2f6247;
            color: white;
            box-shadow: 0 2px 0 #2f6247;
        }
        .popup-tasten .enter:active {
            box-shadow: 0 1px 0 #2f6247;
        }
        .popup-tasten .cancel {
            background: #dccfc0;
            border-color: #b8a28b;
        }

        .popup-actions {
            display: flex;
            gap: 0.6rem;
            margin-top: 0.8rem;
            width: 100%;
        }
        .popup-actions button {
            flex: 1;
            font-size: 1rem;
            padding: 0.6rem 0;
            min-height: 48px;
        }

        /* ----- Bibliothek ----- */
        .bibliothek-list {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }
        .bibliothek-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 1.2rem;
            background: #f5efe8;
            border-radius: 1.8rem;
            border: 2px solid #e6dacb;
            flex-wrap: wrap;
            gap: 0.4rem 1rem;
        }
        .bibliothek-item .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem 1rem;
            align-items: baseline;
        }
        .bibliothek-item .titel {
            font-weight: 700;
            font-size: 0.95rem;
        }
        .bibliothek-item .datum {
            color: #7b6856;
            font-size: 0.8rem;
        }
        .bibliothek-item .info {
            color: #7b6856;
            font-size: 0.8rem;
        }

        .empty-state {
            text-align: center;
            color: #7b6856;
            padding: 2rem 0;
            font-style: italic;
        }

        /* ----- Hilfsklassen ----- */
        .hidden {
            display: none !important;
        }
        .mt-1 {
            margin-top: 1rem;
        }
        .mb-1 {
            margin-bottom: 1rem;
        }
        .text-center {
            text-align: center;
        }
        .flex {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            align-items: center;
        }

        /* ----- Responsive ----- */
        @media (max-width: 500px) {
            #app {
                padding: 0.8rem 0.6rem 1.5rem;
            }
            .spiel-info {
                font-size: 0.8rem;
                padding: 0.5rem 0.8rem;
            }
            table {
                font-size: 0.7rem;
                min-width: 300px;
            }
            th,
            td {
                padding: 0.3rem 0.2rem;
            }
            th:first-child,
            td:first-child {
                padding-left: 0.5rem;
            }
            th:last-child,
            td:last-child {
                padding-right: 0.5rem;
            }
            .spieler-actions button {
                font-size: 0.85rem;
                padding: 0.4rem 0.8rem;
                min-height: 40px;
                flex: 1 0 auto;
            }
            .popup-box {
                padding: 1.2rem 1rem 1.5rem;
            }
            .popup-input-area input {
                font-size: 1.8rem;
                min-height: 60px;
            }
            .popup-tasten button {
                font-size: 1.5rem;
                min-height: 50px;
            }
            .logo {
                font-size: 1.4rem;
            }
            h2 {
                font-size: 1.8rem;
            }
        }

        @media (max-width: 400px) {
            .spieler-actions button {
                flex: 1 0 45%;
            }
        }

        /* ----- Farbverlauf für Zellen (wird dynamisch gesetzt) ----- */
        .cell-score {
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div id="app">

        <!-- Header -->
        <header>
            <div class="logo">
                <span>♠</span> Kartenspiel‑Bibliothek
                <small>local</small>
            </div>
            <div class="header-actions" id="headerActions">
                <!-- Dynamisch befüllt -->
            </div>
        </header>

        <!-- Hauptbereich -->
        <div id="mainArea">
            <!-- Wird von JS gerendert -->
        </div>

    </div>

    <script>
        // ============================================================
        //  DATENMANAGEMENT (localStorage)
        // ============================================================
        const STORAGE_KEY = 'kartenspiel_bibliothek';
        const AKTIV_KEY = 'kartenspiel_aktiv';

        function ladeSpiele() {
            try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; }
        }

        function speichereSpiele(spiele) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(spiele));
        }

        function ladeAktivesSpiel() {
            try { return JSON.parse(localStorage.getItem(AKTIV_KEY)) || null; } catch { return null; }
        }

        function speichereAktivesSpiel(spiel) {
            if (spiel) localStorage.setItem(AKTIV_KEY, JSON.stringify(spiel));
            else localStorage.removeItem(AKTIV_KEY);
        }

        function generiereId() {
            return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
        }

        function aktuellesDatum() {
            return new Date().toISOString();
        }

        function formatDatum(iso) {
            const d = new Date(iso);
            return d.toLocaleString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit',
                minute: '2-digit' });
        }

        // ============================================================
        //  APP-STATE
        // ============================================================
        let aktuellesSpiel = ladeAktivesSpiel();
        let anzeigeSpiel = null;
        let popupSpielerName = null;

        // ============================================================
        //  RENDER-FUNKTIONEN
        // ============================================================

        const headerActions = document.getElementById('headerActions');
        const mainArea = document.getElementById('mainArea');

        function render() {
            renderHeader();
            renderMain();
        }

        function renderHeader() {
            let html = '';
            if (anzeigeSpiel) {
                html += `<button class="outline" id="btnDetailZurueck">← Zurück</button>`;
            } else if (aktuellesSpiel) {
                html += `<button class="primary" id="btnNeueRunde">+ Runde</button>`;
                html += `<button class="danger" id="btnSpielBeenden">✕ Beenden</button>`;
                html += `<button class="outline" id="btnBibliothek">📚 Bibliothek</button>`;
            } else {
                html += `<button class="primary" id="btnNeuesSpiel">+ Neues Spiel</button>`;
                html += `<button class="outline" id="btnBibliothek">📚 Bibliothek</button>`;
            }
            // Ersetze 📚 durch einfaches Icon (Buch)
            headerActions.innerHTML = html.replace(/📚/g, '◈');

            document.getElementById('btnNeuesSpiel')?.addEventListener('click', () => starteNeuesSpiel());
            document.getElementById('btnNeueRunde')?.addEventListener('click', () => {
                document.querySelector('.spieler-actions')?.scrollIntoView({ behavior: 'smooth' });
            });
            document.getElementById('btnSpielBeenden')?.addEventListener('click', () => beendeSpiel());
            document.getElementById('btnBibliothek')?.addEventListener('click', () => zeigeBibliothek());
            document.getElementById('btnDetailZurueck')?.addEventListener('click', () => {
                anzeigeSpiel = null;
                render();
            });
        }

        function renderMain() {
            if (anzeigeSpiel) {
                renderDetailAnsicht(anzeigeSpiel);
            } else if (aktuellesSpiel) {
                renderSpielansicht();
            } else {
                renderBibliothek();
            }
        }

        // ============================================================
        //  SPIELANSICHT (aktiv)
        // ============================================================
        function renderSpielansicht() {
            const s = aktuellesSpiel;
            if (!s) return;

            let html = `
                <div class="spiel-info">
                    <span><span class="label">Titel</span><span class="value">${s.titel || 'Unbenannt'}</span></span>
                    <span><span class="label">Spieler</span><span class="value">${s.spieler.join(', ')}</span></span>
                    <span><span class="label">Runden</span><span class="value">${s.runden.length}</span></span>
                </div>
            `;

            html += renderTabelle(s);

            // Spieler-Buttons mit aktuellen Punkten
            const totals = berechneTotals(s);
            html += `<div class="spieler-actions" id="spielerActions">`;
            s.spieler.forEach(name => {
                const punkte = totals[name] || 0;
                html += `
                    <button class="spieler-btn" data-name="${name}">
                        ${name} <span class="punkte-badge">${punkte}</span>
                    </button>
                `;
            });
            html += `</div>`;

            mainArea.innerHTML = html;

            // Event-Listener für Spieler-Buttons
            document.querySelectorAll('.spieler-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const name = btn.dataset.name;
                    oeffnePopup(name);
                });
            });
        }

        // ============================================================
        //  TABELLE (ohne Gesamt-Spalte, mit Farbverlauf)
        // ============================================================
        function renderTabelle(spiel) {
            if (spiel.runden.length === 0) {
                return `<div class="empty-state" style="padding:1.5rem;">Noch keine Runden gespielt.</div>`;
            }

            const spieler = spiel.spieler;
            // Für jede Runde die Werte sammeln
            let html = `<div class="table-wrap"><table>
                <thead><tr>
                    <th>#</th>
                    <th>Datum</th>
                    ${spieler.map(n => `<th>${n}</th>`).join('')}
                </tr></thead><tbody>
            `;

            spiel.runden.forEach((runde, idx) => {
                const nr = idx + 1;
                const dateStr = formatDatum(runde.zeitstempel || spiel.datum);
                const values = spieler.map(name => runde.punkte[name] || 0);
                const min = Math.min(...values);
                const max = Math.max(...values);
                const range = max - min;

                let rowHtml = `<tr>
                    <td class="runden-nr">${nr}</td>
                    <td class="datum-cell">${dateStr}</td>
                `;

                spieler.forEach((name, i) => {
                    const val = values[i];
                    let bgColor = '#ffffff';
                    if (range !== 0) {
                        const ratio = (val - min) / range;
                        const hue = ratio * 120; // 0 = rot, 120 = grün
                        bgColor = `hsl(${hue}, 65%, 72%)`;
                    } else {
                        bgColor = '#f0ece6';
                    }
                    rowHtml += `<td style="background-color: ${bgColor}; font-weight: 700;">${val > 0 ? '+':''}${val}</td>`;
                });

                rowHtml += `</tr>`;
                html += rowHtml;
            });

            // Keine Gesamt-Zeile mehr!

            html += `</tbody></table></div>`;
            return html;
        }

        function berechneTotals(spiel) {
            const totals = {};
            spiel.spieler.forEach(n => totals[n] = 0);
            spiel.runden.forEach(runde => {
                spiel.spieler.forEach(n => {
                    totals[n] += (runde.punkte[n] || 0);
                });
            });
            return totals;
        }

        // ============================================================
        //  POPUP MIT ZAHLENTASTATUR (+ und -)
        // ============================================================
        function oeffnePopup(spielerName) {
            popupSpielerName = spielerName;

            // Overlay erstellen
            const overlay = document.createElement('div');
            overlay.className = 'popup-overlay';
            overlay.id = 'popupOverlay';

            overlay.innerHTML = `
                <div class="popup-box">
                    <h3>${spielerName}</h3>
                    <div class="sub">Punkte eingeben</div>
                    <div class="popup-input-area">
                        <input type="text" inputmode="numeric" pattern="[-+]?[0-9]*" id="popupInput" placeholder="0" autofocus />
                        <div class="popup-tasten">
                            <button class="op" data-action="7">7</button>
                            <button class="op" data-action="8">8</button>
                            <button class="op" data-action="9">9</button>
                            <button class="op" data-action="4">4</button>
                            <button class="op" data-action="5">5</button>
                            <button class="op" data-action="6">6</button>
                            <button class="op" data-action="1">1</button>
                            <button class="op" data-action="2">2</button>
                            <button class="op" data-action="3">3</button>
                            <button class="op" data-action="+">+</button>
                            <button class="op" data-action="0">0</button>
                            <button class="op" data-action="-">−</button>
                            <button class="clear" data-action="clear">⌫</button>
                            <button class="cancel" data-action="cancel">Abbr</button>
                            <button class="enter" data-action="enter">✓</button>
                        </div>
                    </div>
                </div>
            `;

            document.body.appendChild(overlay);

            const input = document.getElementById('popupInput');
            // Fokus setzen (mobil öffnet Tastatur)
            input.focus();

            // Event-Listener für Tasten
            overlay.querySelectorAll('.popup-tasten button').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const action = btn.dataset.action;
                    handlePopupAction(action, input);
                });
            });

            // Enter-Taste auf Input
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    popupBestätigen(input);
                }
                if (e.key === 'Escape') {
                    popupSchliessen();
                }
            });

            // Klick auf Overlay (außerhalb Box) schließt nicht
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) popupSchliessen();
            });
        }

        function handlePopupAction(action, input) {
            if (action === 'clear') {
                // Letztes Zeichen löschen
                input.value = input.value.slice(0, -1);
            } else if (action === 'cancel') {
                popupSchliessen();
            } else if (action === 'enter') {
                popupBestätigen(input);
            } else {
                // Ziffer oder + / -
                // Erlaubt: Zahlen, +, -
                // Vermeide doppelte Operatoren
                const last = input.value.slice(-1);
                if (['+', '-'].includes(action)) {
                    if (['+', '-'].includes(last)) {
                        // Ersetzen
                        input.value = input.value.slice(0, -1) + action;
                    } else {
                        input.value += action;
                    }
                } else {
                    input.value += action;
                }
            }
            input.focus();
        }

        function popupBestätigen(input) {
            let wert = input.value.trim();
            if (wert === '') wert = '0';
            // Parse
            const num = parseInt(wert);
            if (isNaN(num)) {
                alert('Bitte eine gültige Zahl eingeben.');
                return;
            }
            // Punkte für Spieler speichern
            if (aktuellesSpiel && popupSpielerName) {
                // Wir speichern die Runde noch nicht – wir müssen die Punkte sammeln
                // Da wir pro Spieler einzeln eingeben, sammeln wir in einem temporären Objekt
                if (!window._tmpRunde) window._tmpRunde = {};
                window._tmpRunde[popupSpielerName] = num;

                // Prüfen, ob alle Spieler schon einen Wert haben
                const alleSpieler = aktuellesSpiel.spieler;
                const alleVorhanden = alleSpieler.every(name => name in window._tmpRunde);
                if (alleVorhanden) {
                    // Runde speichern
                    const punkte = { ...window._tmpRunde };
                    aktuellesSpiel.runden.push({
                        punkte: punkte,
                        zeitstempel: aktuellesDatum()
                    });
                    speichereAktivesSpiel(aktuellesSpiel);
                    window._tmpRunde = null;
                    popupSchliessen();
                    render();
                } else {
                    // Nur Popup schließen, aber _tmpRunde bleibt
                    popupSchliessen();
                    // Render neu, aber ohne die Tabelle neu zu laden – die Punkte sind noch nicht in der Tabelle
                    // Wir zeigen die aktuellen Punkte in den Badges an – aber die Tabelle hat noch keine neue Runde
                    // Also einfach nur das Popup schließen – der User muss dann für den nächsten Spieler klicken
                    // Hinweis: Die Badges aktualisieren sich erst nach der Runde.
                    // Wir können nach jedem Schließen die Badges aktualisieren – aber da wir die Runde noch nicht
                    // abgeschlossen haben, bleiben die Badges gleich.
                    // Sobald alle Werte da sind, wird gerendert.
                    // Wir können hier einen Hinweis geben, dass noch Werte fehlen.
                    const fehlende = alleSpieler.filter(n => !(n in window._tmpRunde));
                    if (fehlende.length > 0) {
                        // Kein Alert, einfach weitermachen
                    }
                }
            }
        }

        function popupSchliessen() {
            const overlay = document.getElementById('popupOverlay');
            if (overlay) overlay.remove();
            // Falls noch eine temporäre Runde existiert und nicht alle Spieler eingetragen haben,
            // könnte man sie verwerfen – wir lassen sie einfach, der User kann weiter machen.
            // Aber wenn der User das Popup schließt, ohne alle einzutragen, verfällt die tmp-Runde nach 5 Minuten?
            // Besser: beim Schließen prüfen, ob alle da sind – wenn nicht, verwerfen?
            // Wir machen es einfach: beim Schließen wird _tmpRunde zurückgesetzt, wenn nicht alle da sind.
            if (window._tmpRunde && aktuellesSpiel) {
                const alle = aktuellesSpiel.spieler;
                const alleDa = alle.every(n => n in window._tmpRunde);
                if (!alleDa) {
                    window._tmpRunde = null;
                }
            }
        }

        // ============================================================
        //  NEUES SPIEL STARTEN
        // ============================================================
        function starteNeuesSpiel() {
            const eingabe = prompt('Spielernamen (getrennt durch Komma):');
            if (!eingabe) return;
            const names = eingabe.split(',').map(s => s.trim()).filter(s => s.length > 0);
            if (names.length < 2) {
                alert('Mindestens 2 Spieler.');
                return;
            }
            const titel = prompt('Titel (optional):') || formatDatum(aktuellesDatum());
            const neuesSpiel = {
                id: generiereId(),
                titel: titel,
                datum: aktuellesDatum(),
                spieler: names,
                runden: [],
                erstelltAm: aktuellesDatum()
            };
            speichereAktivesSpiel(neuesSpiel);
            aktuellesSpiel = neuesSpiel;
            anzeigeSpiel = null;
            window._tmpRunde = null;
            render();
        }

        // ============================================================
        //  SPIEL BEENDEN
        // ============================================================
        function beendeSpiel() {
            if (!aktuellesSpiel) return;
            if (aktuellesSpiel.runden.length === 0) {
                if (!confirm('Keine Runden. Trotzdem beenden?')) return;
            }
            const spieleListe = ladeSpiele();
            spieleListe.push({ ...aktuellesSpiel });
            speichereSpiele(spieleListe);
            speichereAktivesSpiel(null);
            aktuellesSpiel = null;
            anzeigeSpiel = null;
            window._tmpRunde = null;
            render();
        }

        // ============================================================
        //  BIBLIOTHEK
        // ============================================================
        function zeigeBibliothek() {
            anzeigeSpiel = null;
            render();
        }

        function renderBibliothek() {
            const alle = ladeSpiele();
            if (alle.length === 0) {
                mainArea.innerHTML = `
                    <div class="empty-state">
                        <p style="font-size:1.2rem; margin-bottom:0.5rem;">◈ Keine Spiele gespeichert</p>
                        <p style="font-size:0.95rem;">Starte ein neues Spiel, um deine ersten Runden zu erfassen.</p>
                    </div>
                `;
                return;
            }

            const sortiert = [...alle].sort((a, b) => new Date(b.datum) - new Date(a.datum));
            let html = `<div class="bibliothek-list">`;
            sortiert.forEach(s => {
                html += `
                    <div class="bibliothek-item">
                        <div class="meta">
                            <span class="titel">${s.titel || 'Unbenannt'}</span>
                            <span class="datum">${formatDatum(s.datum)}</span>
                            <span class="info">${s.spieler.length} Spieler · ${s.runden.length} Runden</span>
                        </div>
                        <button class="outline detail-btn" data-id="${s.id}">Details</button>
                    </div>
                `;
            });
            html += `</div>`;
            mainArea.innerHTML = html;

            document.querySelectorAll('.detail-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.dataset.id;
                    const spiel = alle.find(s => s.id === id);
                    if (spiel) {
                        anzeigeSpiel = spiel;
                        render();
                    }
                });
            });
        }

        // ============================================================
        //  DETAILANSICHT (archiviert)
        // ============================================================
        function renderDetailAnsicht(spiel) {
            if (!spiel) return;
            let html = `
                <div class="spiel-info">
                    <span><span class="label">Titel</span><span class="value">${spiel.titel || 'Unbenannt'}</span></span>
                    <span><span class="label">Datum</span><span class="value">${formatDatum(spiel.datum)}</span></span>
                    <span><span class="label">Spieler</span><span class="value">${spiel.spieler.join(', ')}</span></span>
                    <span><span class="label">Runden</span><span class="value">${spiel.runden.length}</span></span>
                </div>
            `;
            html += renderTabelle(spiel);
            mainArea.innerHTML = html;
        }

        // ============================================================
        //  INIT
        // ============================================================
        render();

        console.log('♠ Kartenspiel-Bibliothek (Happy Monkey) geladen.');
    </script>
</body>
</html>
