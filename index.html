<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Kartenspiel‑Bibliothek</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f2f5f9;
            color: #0b1a2e;
            padding: 0.8rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        #app {
            max-width: 1000px;
            width: 100%;
            background: white;
            border-radius: 1.8rem;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
            padding: 1.2rem 1rem 2rem;
        }

        /* Header – mobiler optimiert */
        header {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-bottom: 1.2rem;
            padding-bottom: 0.6rem;
            border-bottom: 2px solid #edf2f7;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: -0.3px;
            flex-wrap: wrap;
        }
        .logo small {
            font-size: 0.75rem;
            font-weight: 400;
            color: #5e6f8d;
        }

        .header-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: flex-start;
        }

        /* Buttons – größer für Touch */
        button {
            background: #edf2f7;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 3rem;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s, transform 0.05s;
            color: #1a2a3a;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            white-space: nowrap;
            touch-action: manipulation;
            min-height: 44px;
            justify-content: center;
        }
        button:active {
            transform: scale(0.96);
        }
        button.primary {
            background: #1a2a3a;
            color: white;
        }
        button.primary:hover {
            background: #0e1a26;
        }
        button.success {
            background: #0d7a4b;
            color: white;
        }
        button.success:hover {
            background: #0a5f3a;
        }
        button.danger {
            background: #b22234;
            color: white;
        }
        button.danger:hover {
            background: #8f1a1c;
        }
        button.outline {
            background: transparent;
            border: 1.5px solid #cbd5e1;
        }
        button.outline:hover {
            background: #f1f5f9;
        }

        /* Spielinfo */
        .spiel-info {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem 1.2rem;
            background: #f8fafc;
            border-radius: 1.2rem;
            padding: 0.6rem 1rem;
            margin-bottom: 1rem;
            border: 1px solid #e9edf4;
            align-items: baseline;
            font-size: 0.9rem;
        }
        .spiel-info .label {
            color: #5e6f8d;
            font-weight: 500;
            margin-right: 0.2rem;
        }
        .spiel-info .value {
            font-weight: 500;
        }

        /* Tabelle – mobil optimiert */
        .table-wrap {
            overflow-x: auto;
            border-radius: 1.2rem;
            border: 1px solid #e9edf4;
            background: #ffffff;
            margin-bottom: 1.2rem;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            min-width: 400px;
        }

        th {
            background: #f8fafc;
            color: #1a2a3a;
            font-weight: 600;
            padding: 0.5rem 0.4rem;
            text-align: left;
            border-bottom: 2px solid #e2e8f0;
            white-space: nowrap;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        th:first-child {
            padding-left: 0.8rem;
        }
        th:last-child {
            padding-right: 0.8rem;
        }

        td {
            padding: 0.5rem 0.4rem;
            border-bottom: 1px solid #edf2f7;
            vertical-align: middle;
            text-align: center;
        }
        td:first-child {
            padding-left: 0.8rem;
            font-weight: 600;
            text-align: left;
        }
        td:last-child {
            padding-right: 0.8rem;
            font-weight: 600;
        }

        .row-total td {
            background: #f8fafc;
            font-weight: 700;
            border-top: 2px solid #d0d9e6;
            padding-top: 0.6rem;
            padding-bottom: 0.6rem;
        }

        .runden-nr {
            color: #1a2a3a;
        }
        .datum-cell {
            color: #5e6f8d;
            font-size: 0.7rem;
            white-space: nowrap;
        }

        /* Eingabeformular – mobilfreundlich */
        .runde-form {
            background: #f8fafc;
            border-radius: 1.2rem;
            padding: 1rem 1.2rem;
            border: 1px solid #e9edf4;
            margin-bottom: 1.2rem;
        }
        .runde-form .form-title {
            font-weight: 600;
            margin-bottom: 0.6rem;
            font-size: 1rem;
        }
        .runde-form .inputs {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 0.5rem;
        }
        .runde-form .input-group {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            background: white;
            padding: 0.1rem 0.3rem 0.1rem 0.6rem;
            border-radius: 2.5rem;
            border: 1.5px solid #e2e8f0;
            min-height: 44px;
        }
        .runde-form .input-group label {
            font-weight: 500;
            font-size: 0.85rem;
            color: #1a2a3a;
            flex: 0 0 auto;
        }
        .runde-form .input-group input {
            border: none;
            padding: 0.4rem 0.2rem 0.4rem 0;
            width: 4rem;
            font-size: 1rem;
            font-weight: 500;
            text-align: right;
            background: transparent;
            outline: none;
            min-height: 36px;
            /* Mobil: numerische Tastatur erzwingen */;
            inputmode: numeric;
            type: number;
            pattern: "[0-9]*";
        }
        .runde-form .input-group input:focus {
            border-color: #1a2a3a;
        }
        .runde-form .actions {
            margin-top: 0.8rem;
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }
        .runde-form .actions button {
            flex: 1 0 auto;
            min-width: 100px;
        }

        /* Bibliothek */
        .bibliothek-list {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }
        .bibliothek-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.7rem 1rem;
            background: #f8fafc;
            border-radius: 1rem;
            border: 1px solid #e9edf4;
            flex-wrap: wrap;
            gap: 0.4rem 1rem;
        }
        .bibliothek-item .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem 1rem;
            align-items: baseline;
        }
        .bibliothek-item .titel {
            font-weight: 600;
            font-size: 0.95rem;
        }
        .bibliothek-item .datum {
            color: #5e6f8d;
            font-size: 0.8rem;
        }
        .bibliothek-item .info {
            color: #5e6f8d;
            font-size: 0.8rem;
        }

        .empty-state {
            text-align: center;
            color: #8a9bb0;
            padding: 2rem 0;
            font-style: italic;
        }

        /* Hilfsklassen */
        .hidden {
            display: none !important;
        }
        .flex {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            align-items: center;
        }
        .mt-1 {
            margin-top: 1rem;
        }
        .mb-1 {
            margin-bottom: 1rem;
        }
        .text-center {
            text-align: center;
        }
        .w-full {
            width: 100%;
        }

        /* Responsive Anpassungen */
        @media (max-width: 500px) {
            #app {
                padding: 0.8rem 0.6rem 1.5rem;
            }
            .spiel-info {
                font-size: 0.8rem;
                padding: 0.4rem 0.8rem;
            }
            .runde-form .inputs {
                grid-template-columns: 1fr 1fr;
            }
            .runde-form .input-group {
                padding: 0.1rem 0.2rem 0.1rem 0.5rem;
            }
            .runde-form .input-group input {
                width: 3.5rem;
                font-size: 0.95rem;
            }
            .runde-form .actions button {
                min-width: 80px;
                font-size: 0.85rem;
            }
            table {
                font-size: 0.7rem;
                min-width: 320px;
            }
            th,
            td {
                padding: 0.3rem 0.2rem;
            }
            th:first-child,
            td:first-child {
                padding-left: 0.4rem;
            }
            th:last-child,
            td:last-child {
                padding-right: 0.4rem;
            }
            .bibliothek-item {
                padding: 0.5rem 0.8rem;
            }
            .header-actions button {
                font-size: 0.85rem;
                padding: 0.4rem 0.8rem;
                min-height: 40px;
            }
        }

        @media (max-width: 400px) {
            .runde-form .inputs {
                grid-template-columns: 1fr;
            }
        }

        /* Farbverlauf für Zellen – wird dynamisch gesetzt */
        .cell-pos-neg {
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div id="app">

        <!-- Header -->
        <header>
            <div class="logo">
                🃏 Kartenspiel‑Bibliothek
                <small>local</small>
            </div>
            <div class="header-actions" id="headerActions">
                <!-- Dynamisch befüllt -->
            </div>
        </header>

        <!-- Hauptbereich -->
        <div id="mainArea">
            <!-- Wird von JS gerendert -->
        </div>

    </div>

    <script>
        // ============================================================
        //  DATENMANAGEMENT (localStorage)
        // ============================================================
        const STORAGE_KEY = 'kartenspiel_bibliothek';
        const AKTIV_KEY = 'kartenspiel_aktiv';

        function ladeSpiele() {
            try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; }
        }

        function speichereSpiele(spiele) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(spiele));
        }

        function ladeAktivesSpiel() {
            try { return JSON.parse(localStorage.getItem(AKTIV_KEY)) || null; } catch { return null; }
        }

        function speichereAktivesSpiel(spiel) {
            if (spiel) localStorage.setItem(AKTIV_KEY, JSON.stringify(spiel));
            else localStorage.removeItem(AKTIV_KEY);
        }

        function generiereId() {
            return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
        }

        function aktuellesDatum() {
            return new Date().toISOString();
        }

        function formatDatum(iso) {
            const d = new Date(iso);
            return d.toLocaleString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit',
                minute: '2-digit' });
        }

        // ============================================================
        //  APP-STATE
        // ============================================================
        let aktuellesSpiel = ladeAktivesSpiel();
        let anzeigeSpiel = null;

        // ============================================================
        //  RENDER-FUNKTIONEN
        // ============================================================

        const headerActions = document.getElementById('headerActions');
        const mainArea = document.getElementById('mainArea');

        function render() {
            renderHeader();
            renderMain();
        }

        function renderHeader() {
            let html = '';
            if (anzeigeSpiel) {
                html += `<button class="outline" id="btnDetailZurueck">← Zurück</button>`;
            } else if (aktuellesSpiel) {
                html += `<button class="primary" id="btnNeueRunde">➕ Runde</button>`;
                html += `<button class="danger" id="btnSpielBeenden">⏹ Beenden</button>`;
                html += `<button class="outline" id="btnBibliothek">📚 Bibliothek</button>`;
            } else {
                html += `<button class="primary" id="btnNeuesSpiel">➕ Neues Spiel</button>`;
                html += `<button class="outline" id="btnBibliothek">📚 Bibliothek</button>`;
            }
            headerActions.innerHTML = html;

            document.getElementById('btnNeuesSpiel')?.addEventListener('click', () => starteNeuesSpiel());
            document.getElementById('btnNeueRunde')?.addEventListener('click', () => {
                document.querySelector('.runde-form')?.scrollIntoView({ behavior: 'smooth' });
            });
            document.getElementById('btnSpielBeenden')?.addEventListener('click', () => beendeSpiel());
            document.getElementById('btnBibliothek')?.addEventListener('click', () => zeigeBibliothek());
            document.getElementById('btnDetailZurueck')?.addEventListener('click', () => {
                anzeigeSpiel = null;
                render();
            });
        }

        function renderMain() {
            if (anzeigeSpiel) {
                renderDetailAnsicht(anzeigeSpiel);
            } else if (aktuellesSpiel) {
                renderSpielansicht();
            } else {
                renderBibliothek();
            }
        }

        // ============================================================
        //  SPIELANSICHT (aktiv)
        // ============================================================
        function renderSpielansicht() {
            const s = aktuellesSpiel;
            if (!s) return;

            let html = `
                <div class="spiel-info">
                    <span><span class="label">Titel</span><span class="value">${s.titel || 'Unbenannt'}</span></span>
                    <span><span class="label">Spieler</span><span class="value">${s.spieler.join(', ')}</span></span>
                    <span><span class="label">Runden</span><span class="value">${s.runden.length}</span></span>
                </div>
            `;

            html += renderTabelle(s);

            html += `
                <div class="runde-form" id="neueRundeForm">
                    <div class="form-title">✏️ Neue Runde eintragen</div>
                    <div class="inputs" id="rundeInputs">
            `;
            s.spieler.forEach(name => {
                html += `
                    <div class="input-group">
                        <label>${name}</label>
                        <input type="number" step="1" inputmode="numeric" pattern="[0-9]*" class="runde-input" data-name="${name}" value="0" />
                    </div>
                `;
            });
            html += `
                    </div>
                    <div class="actions">
                        <button class="success" id="btnRundeSpeichern">✅ Runde speichern</button>
                        <button class="outline" id="btnRundeReset">↺ Zurücksetzen</button>
                    </div>
                </div>
            `;

            mainArea.innerHTML = html;

            document.getElementById('btnRundeSpeichern')?.addEventListener('click', () => speichereRunde());
            document.getElementById('btnRundeReset')?.addEventListener('click', () => {
                document.querySelectorAll('.runde-input').forEach(inp => inp.value = '0');
            });
            document.querySelectorAll('.runde-input').forEach(inp => {
                inp.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        document.getElementById('btnRundeSpeichern')?.click();
                    }
                });
            });
        }

        // ============================================================
        //  TABELLE MIT FARBVERLAUF PRO ZEILE
        // ============================================================
        function renderTabelle(spiel) {
            if (spiel.runden.length === 0) {
                return `<div class="empty-state" style="padding:1.5rem;">Noch keine Runden gespielt.</div>`;
            }

            const spieler = spiel.spieler;
            const totals = {};
            spieler.forEach(n => totals[n] = 0);

            let html = `<div class="table-wrap"><table>
                <thead><tr>
                    <th>#</th>
                    <th>Datum</th>
                    ${spieler.map(n => `<th>${n}</th>`).join('')}
                    <th>Gesamt</th>
                </tr></thead><tbody>
            `;

            spiel.runden.forEach((runde, idx) => {
                const nr = idx + 1;
                const dateStr = formatDatum(runde.zeitstempel || spiel.datum);
                const values = spieler.map(name => runde.punkte[name] || 0);
                const min = Math.min(...values);
                const max = Math.max(...values);
                const range = max - min;

                let rowHtml = `<tr>
                    <td class="runden-nr">${nr}</td>
                    <td class="datum-cell">${dateStr}</td>
                `;

                // Jede Zelle mit Hintergrundfarbe basierend auf Wert
                spieler.forEach((name, i) => {
                    const val = values[i];
                    let bgColor = '#ffffff'; // Standard
                    if (range !== 0) {
                        const ratio = (val - min) / range; // 0..1
                        // Farbverlauf: rot (0) -> gelb (0.5) -> grün (1)
                        // Verwende HSL: hue von 0 bis 120
                        const hue = ratio * 120;
                        const sat = 70;
                        const lig = 70;
                        bgColor = `hsl(${hue}, ${sat}%, ${lig}%)`;
                    } else {
                        // Alle gleich → neutral
                        bgColor = '#f0f0f0';
                    }
                    // Textfarbe je nach Helligkeit anpassen (optional)
                    rowHtml += `<td style="background-color: ${bgColor}; font-weight: 500;">${val > 0 ? '+':''}${val}</td>`;
                    // totals aktualisieren
                    totals[name] += val;
                });

                // Gesamtpunktzahl für diese Runde (kumuliert)
                const totalSum = spieler.reduce((sum, name) => sum + totals[name], 0);
                rowHtml += `<td class="total-cell">${totalSum}</td>`;
                rowHtml += `</tr>`;
                html += rowHtml;
            });

            // Zeile mit Gesamtpunktzahlen
            let totalRow = `<tr class="row-total"><td colspan="2">Gesamt</td>`;
            spieler.forEach(name => {
                totalRow += `<td>${totals[name]}</td>`;
            });
            const totalAll = spieler.reduce((sum, name) => sum + totals[name], 0);
            totalRow += `<td>${totalAll}</td></tr>`;
            html += totalRow;

            html += `</tbody></table></div>`;
            return html;
        }

        // ============================================================
        //  RUNDE SPEICHERN
        // ============================================================
        function speichereRunde() {
            if (!aktuellesSpiel) return;
            const inputs = document.querySelectorAll('.runde-input');
            const punkte = {};
            let alleNull = true;
            inputs.forEach(inp => {
                const val = parseInt(inp.value);
                if (!isNaN(val) && val !== 0) alleNull = false;
                punkte[inp.dataset.name] = isNaN(val) ? 0 : val;
            });
            aktuellesSpiel.spieler.forEach(name => {
                if (!(name in punkte)) punkte[name] = 0;
            });
            if (alleNull) {
                if (!confirm('Alle Werte sind 0. Trotzdem Runde speichern?')) return;
            }
            aktuellesSpiel.runden.push({
                punkte: punkte,
                zeitstempel: aktuellesDatum()
            });
            speichereAktivesSpiel(aktuellesSpiel);
            render();
        }

        // ============================================================
        //  NEUES SPIEL STARTEN
        // ============================================================
        function starteNeuesSpiel() {
            const eingabe = prompt('Gib die Spielernamen ein, getrennt durch Komma (z.B. Anna, Bert, Clara):');
            if (!eingabe) return;
            const names = eingabe.split(',').map(s => s.trim()).filter(s => s.length > 0);
            if (names.length < 2) {
                alert('Mindestens 2 Spieler benötigt.');
                return;
            }
            const titel = prompt('Titel des Spiels (optional):') || formatDatum(aktuellesDatum());
            const neuesSpiel = {
                id: generiereId(),
                titel: titel,
                datum: aktuellesDatum(),
                spieler: names,
                runden: [],
                erstelltAm: aktuellesDatum()
            };
            speichereAktivesSpiel(neuesSpiel);
            aktuellesSpiel = neuesSpiel;
            anzeigeSpiel = null;
            render();
        }

        // ============================================================
        //  SPIEL BEENDEN
        // ============================================================
        function beendeSpiel() {
            if (!aktuellesSpiel) return;
            if (aktuellesSpiel.runden.length === 0) {
                if (!confirm('Das Spiel hat keine Runden. Trotzdem beenden?')) return;
            }
            const spieleListe = ladeSpiele();
            spieleListe.push({ ...aktuellesSpiel });
            speichereSpiele(spieleListe);
            speichereAktivesSpiel(null);
            aktuellesSpiel = null;
            anzeigeSpiel = null;
            render();
        }

        // ============================================================
        //  BIBLIOTHEK
        // ============================================================
        function zeigeBibliothek() {
            anzeigeSpiel = null;
            render();
        }

        function renderBibliothek() {
            const alle = ladeSpiele();
            if (alle.length === 0) {
                mainArea.innerHTML = `
                    <div class="empty-state">
                        <p style="font-size:1.2rem; margin-bottom:0.5rem;">📭 Keine Spiele gespeichert</p>
                        <p style="font-size:0.95rem;">Starte ein neues Spiel, um deine ersten Runden zu erfassen.</p>
                    </div>
                `;
                return;
            }

            const sortiert = [...alle].sort((a, b) => new Date(b.datum) - new Date(a.datum));
            let html = `<div class="bibliothek-list">`;
            sortiert.forEach(s => {
                html += `
                    <div class="bibliothek-item">
                        <div class="meta">
                            <span class="titel">${s.titel || 'Unbenannt'}</span>
                            <span class="datum">${formatDatum(s.datum)}</span>
                            <span class="info">${s.spieler.length} Spieler · ${s.runden.length} Runden</span>
                        </div>
                        <button class="outline detail-btn" data-id="${s.id}">Details</button>
                    </div>
                `;
            });
            html += `</div>`;
            mainArea.innerHTML = html;

            document.querySelectorAll('.detail-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.dataset.id;
                    const spiel = alle.find(s => s.id === id);
                    if (spiel) {
                        anzeigeSpiel = spiel;
                        render();
                    }
                });
            });
        }

        // ============================================================
        //  DETAILANSICHT (archiviert)
        // ============================================================
        function renderDetailAnsicht(spiel) {
            if (!spiel) return;
            let html = `
                <div class="spiel-info">
                    <span><span class="label">Titel</span><span class="value">${spiel.titel || 'Unbenannt'}</span></span>
                    <span><span class="label">Datum</span><span class="value">${formatDatum(spiel.datum)}</span></span>
                    <span><span class="label">Spieler</span><span class="value">${spiel.spieler.join(', ')}</span></span>
                    <span><span class="label">Runden</span><span class="value">${spiel.runden.length}</span></span>
                </div>
            `;
            html += renderTabelle(spiel);
            mainArea.innerHTML = html;
        }

        // ============================================================
        //  INIT
        // ============================================================
        render();

        console.log('🃏 Kartenspiel-Bibliothek (mobil optimiert) geladen.');
    </script>
</body>
</html>
